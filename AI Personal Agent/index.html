<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Companion</title>
    <!-- External Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Local CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-robot text-2xl"></i>
                <h1 class="text-xl font-bold">AI Chat Companion</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="settings-btn" class="p-2 rounded-full hover:bg-indigo-700 transition">
                    <i class="fas fa-cog"></i>
                </button>
                <button id="new-chat-btn" class="px-3 py-1 bg-indigo-500 rounded-md hover:bg-indigo-700 transition">
                    <i class="fas fa-plus mr-1"></i> New Chat
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto p-4 flex flex-col md:flex-row gap-4 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-white rounded-lg shadow-md p-4 flex flex-col overflow-hidden">
            <div class="mb-4">
                <h2 class="font-semibold text-gray-700 mb-2">Recent Chats</h2>
                <ul id="chat-history" class="space-y-1">
                    <li class="p-2 rounded hover:bg-gray-100 cursor-pointer flex justify-between items-center">
                        <span class="truncate">Customer Support Query</span>
                        <i class="fas fa-trash-alt text-gray-400 hover:text-red-500 text-xs"></i>
                    </li>
                    <li class="p-2 rounded hover:bg-gray-100 cursor-pointer flex justify-between items-center">
                        <span class="truncate">Technical Help</span>
                        <i class="fas fa-trash-alt text-gray-400 hover:text-red-500 text-xs"></i>
                    </li>
                    <li class="p-2 rounded bg-gray-100 cursor-pointer flex justify-between items-center">
                        <span class="truncate font-medium">New Conversation</span>
                        <i class="fas fa-trash-alt text-gray-400 hover:text-red-500 text-xs"></i>
                    </li>
                </ul>
            </div>
            <div class="mt-auto">
                <div class="p-3 bg-indigo-50 rounded-lg">
                    <h3 class="font-medium text-indigo-800 mb-1">AI Capabilities</h3>
                    <ul class="text-xs text-gray-600 space-y-1">
                        <li class="flex items-center"><i class="fas fa-check-circle text-indigo-500 mr-2"></i> Smart Replies</li>
                        <li class="flex items-center"><i class="fas fa-check-circle text-indigo-500 mr-2"></i> Sentiment Analysis</li>
                        <li class="flex items-center"><i class="fas fa-check-circle text-indigo-500 mr-2"></i> Context Awareness</li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col bg-white rounded-lg shadow-md overflow-hidden">
            <!-- Messages Container -->
            <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-4">
                <div class="message-animation">
                    <div class="flex items-start space-x-3">
                        <div class="bg-indigo-100 p-2 rounded-full">
                            <i class="fas fa-robot text-indigo-600"></i>
                        </div>
                        <div class="flex-1">
                            <div class="bg-gray-100 p-3 rounded-lg rounded-tl-none max-w-3xl">
                                <p>Hello! I'm your AI assistant. How can I help you today?</p>
                                <div class="mt-2 flex space-x-2">
                                    <span class="text-xs px-2 py-1 bg-indigo-100 text-indigo-800 rounded-full">Positive</span>
                                    <span class="text-xs px-2 py-1 bg-gray-200 text-gray-800 rounded-full">Welcome</span>
                                </div>
                            </div>
                            <div class="text-xs text-gray-500 mt-1 ml-1">Just now</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="border-t p-4 bg-gray-50">
                <!-- Smart Reply Suggestions -->
                <div id="smart-replies" class="flex flex-wrap gap-2 mb-3">
                    <button class="smart-reply-btn px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-sm hover:bg-indigo-200 transition">
                        How do I reset my password?
                    </button>
                    <button class="smart-reply-btn px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-sm hover:bg-indigo-200 transition">
                        I need technical support
                    </button>
                    <button class="smart-reply-btn px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-sm hover:bg-indigo-200 transition">
                        What are your business hours?
                    </button>
                </div>
                
                <div class="flex items-end space-x-2">
                    <div class="flex-1 relative">
                        <textarea 
                            id="message-input" 
                            class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none" 
                            rows="1" 
                            placeholder="Type your message here..." 
                            style="min-height: 44px; max-height: 120px;"></textarea>
                        <button id="send-btn" class="absolute right-2 bottom-2 p-2 text-indigo-600 hover:text-indigo-800">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <button id="mic-btn" class="p-3 bg-indigo-100 text-indigo-600 rounded-lg hover:bg-indigo-200 transition">
                        <i class="fas fa-microphone"></i>
                    </button>
                </div>
                
                <div class="mt-2 flex justify-between items-center text-xs text-gray-500">
                    <div id="sentiment-indicator" class="flex items-center">
                        <span>Sentiment: </span>
                        <span id="sentiment-value" class="ml-1 font-medium">Neutral</span>
                        <i id="sentiment-icon" class="fas fa-meh ml-1"></i>
                    </div>
                    <div>
                        <button id="clear-btn" class="text-gray-500 hover:text-gray-700">
                            <i class="fas fa-trash-alt mr-1"></i> Clear
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg">Settings</h3>
                <button id="close-settings" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">AI Personality</label>
                    <select class="w-full p-2 border rounded-md">
                        <option>Professional</option>
                        <option>Friendly</option>
                        <option>Technical</option>
                        <option>Casual</option>
                    </select>
                </div>
                <div>
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" class="rounded text-indigo-600" checked>
                        <span class="text-sm text-gray-700">Enable Smart Replies</span>
                    </label>
                </div>
                <div>
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" class="rounded text-indigo-600" checked>
                        <span class="text-sm text-gray-700">Enable Sentiment Analysis</span>
                    </label>
                </div>
            </div>
            <div class="p-4 border-t flex justify-end">
                <button class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
                    Save Settings
                </button>
            </div>
        </div>
    </div>

    <!-- Local JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
